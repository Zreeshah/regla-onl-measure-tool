<!doctype html>
<html lang="es">
  <head>

    <title>Página no encontrada | Regla.Onl</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #faf9ff; color: #27223b; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 620px; text-align: center; }
      .code { color: #7c5cf0; font-size: clamp(3rem, 12vw, 7rem); font-weight: 800; line-height: 1; margin: 0; }
      h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); margin: 20px 0 12px; }
      p { color: #5b5670; font-size: 1.05rem; line-height: 1.6; margin: 0 0 28px; }
      a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: #7c5cf0; color: #fff; font-weight: 700; text-decoration: none; }
      a:hover, a:focus-visible { background: #6546d6; }
    </style>
  </head>

    <main>
      <p class="code" aria-hidden="true">404</p>
